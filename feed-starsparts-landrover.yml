Профиль поперечных перекладин аэродинамически оптимизирован для снижения сопротивления набегающему потоку и уменьшения шума. Поперечные перекладины запираются замками для защиты от кражи и имеют Т-образный паз для закрепления аксессуаров Land Rover, предназначенных для установки на крыше. Для установки любых аксессуаров Range Rover Evoque и Coupe, предназначенных для монтажа на крыше автомобиля, необходимы рейлинги и поперечные перекладины.
